<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Scanner · Dual Gate</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B1120">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>

    <style>
        /* ───────────── RESET & BASE ───────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #070C1A;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-glass: rgba(255, 255, 255, 0.06);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #475569;

            /* Gate 1 (Cyan) */
            --gate1-primary: #2DD4BF;
            --gate1-glow: rgba(45, 212, 191, 0.25);
            --gate1-bg: rgba(45, 212, 191, 0.08);

            /* Gate 2 (Amber) */
            --gate2-primary: #FBBF24;
            --gate2-glow: rgba(251, 191, 36, 0.25);
            --gate2-bg: rgba(251, 191, 36, 0.08);

            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 14px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font);
            background: var(--bg-deep);
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ───────────── APP SHELL ───────────── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 20px 30px;
            background: radial-gradient(ellipse at 50% 0%, #111D33 0%, #070C1A 80%);
            position: relative;
            overflow: hidden;
        }

        /* Ambient glow */
        #app::before {
            content: '';
            position: absolute;
            top: -15%;
            right: -30%;
            width: 80%;
            height: 50%;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        #app::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -30%;
            width: 80%;
            height: 50%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ───────────── VIEWS ───────────── */
        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.3s ease;
        }
        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ───────────── HEADER (shared) ───────────── */
        .app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 20px;
            flex-shrink: 0;
        }
        .logo-wrapper {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2DD4BF, #0EA5E9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(45, 212, 191, 0.3);
        }
        .logo-wrapper svg {
            width: 65%;
            height: 65%;
        }
        .header-text h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #fff;
        }
        .header-text .sub {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* ───────────── DASHBOARD ───────────── */
        .dashboard-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 24px;
            padding: 12px 0;
        }

        .gate-btn {
            flex: 1;
            min-height: 160px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .gate-btn:active {
            transform: scale(0.96);
        }

        .gate-btn .gate-icon {
            font-size: 42px;
            line-height: 1;
        }
        .gate-btn .gate-label {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .gate-btn .gate-sub {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Gate 1 Dashboard */
        .gate-btn.gate-1 .gate-label {
            color: var(--gate1-primary);
        }
        .gate-btn.gate-1 {
            border-color: rgba(45, 212, 191, 0.15);
        }
        .gate-btn.gate-1:active {
            border-color: var(--gate1-primary);
            box-shadow: 0 0 40px rgba(45, 212, 191, 0.1);
        }

        /* Gate 2 Dashboard */
        .gate-btn.gate-2 .gate-label {
            color: var(--gate2-primary);
        }
        .gate-btn.gate-2 {
            border-color: rgba(251, 191, 36, 0.15);
        }
        .gate-btn.gate-2:active {
            border-color: var(--gate2-primary);
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.1);
        }

        /* Dashboard Footer */
        .dashboard-footer {
            display: flex;
            justify-content: flex-end;
            padding-top: 16px;
            flex-shrink: 0;
        }
        .reset-all-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }
        .reset-all-btn:active {
            transform: scale(0.92);
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }

        /* ───────────── GATE VIEW ───────────── */
        .gate-view-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-glass);
            margin-bottom: 20px;
        }
        .back-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn:active {
            transform: scale(0.90);
            background: var(--bg-card-hover);
        }
        .gate-view-title {
            flex: 1;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .gate-view-title .highlight-g1 {
            color: var(--gate1-primary);
        }
        .gate-view-title .highlight-g2 {
            color: var(--gate2-primary);
        }

        .gate-count-display {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 8px 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .gate-count-display .count-number {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            transition: var(--transition);
        }
        .gate-count-display .count-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gate-view-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Scanner Container */
        .scanner-wrapper {
            background: #000;
            border-radius: var(--radius-sm);
            overflow: hidden;
            aspect-ratio: 4 / 3;
            min-height: 200px;
            border: 1px solid var(--border-glass);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #scanner-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #scanner-container video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }

        /* Scanner Overlay */
        .scanner-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
        }
        .scanner-overlay .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: rgba(255, 255, 255, 0.5);
            border-style: solid;
            border-width: 0;
            filter: drop-shadow(0 0 8px rgba(45, 212, 191, 0.4));
        }
        .scanner-overlay .corner.tl {
            top: 20px;
            left: 20px;
            border-top-width: 3px;
            border-left-width: 3px;
        }
        .scanner-overlay .corner.tr {
            top: 20px;
            right: 20px;
            border-top-width: 3px;
            border-right-width: 3px;
        }
        .scanner-overlay .corner.bl {
            bottom: 20px;
            left: 20px;
            border-bottom-width: 3px;
            border-left-width: 3px;
        }
        .scanner-overlay .corner.br {
            bottom: 20px;
            right: 20px;
            border-bottom-width: 3px;
            border-right-width: 3px;
        }

        .scanner-placeholder {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            padding: 20px;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #0A0F1E;
            z-index: 1;
            transition: opacity 0.4s ease;
        }
        .scanner-placeholder.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .scanner-placeholder .big-icon {
            font-size: 48px;
            opacity: 0.3;
        }

        .scan-toggle-btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            flex-shrink: 0;
        }
        .scan-toggle-btn:active {
            transform: scale(0.97);
        }
        .scan-toggle-btn.active {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #EF4444;
        }
        .scan-toggle-btn.active-g1 {
            background: var(--gate1-bg);
            border-color: var(--gate1-primary);
            color: var(--gate1-primary);
        }
        .scan-toggle-btn.active-g2 {
            background: var(--gate2-bg);
            border-color: var(--gate2-primary);
            color: var(--gate2-primary);
        }

        .gate-reset-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 20px;
            flex-shrink: 0;
        }
        .gate-reset-btn:active {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
        }

        /* ───────────── TOAST / FLASH ───────────── */
        .flash-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: rgba(255, 255, 255, 0.15);
            opacity: 0;
            transition: opacity 0.1s ease;
        }
        .flash-overlay.show {
            opacity: 1;
        }
        .flash-overlay.green {
            background: rgba(45, 212, 191, 0.2);
        }
        .flash-overlay.gold {
            background: rgba(251, 191, 36, 0.2);
        }

        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(24px);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            padding: 14px 28px;
            border-radius: 40px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--border-glass);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .gate-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .toast .gate-badge.g1 {
            background: var(--gate1-bg);
            color: var(--gate1-primary);
            border: 1px solid rgba(45, 212, 191, 0.2);
        }
        .toast .gate-badge.g2 {
            background: var(--gate2-bg);
            color: var(--gate2-primary);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        /* ───────────── RESPONSIVE ───────────── */
        @media (max-width: 420px) {
            #app {
                padding: 16px 14px 20px;
            }
            .gate-btn {
                min-height: 120px;
            }
            .gate-btn .gate-icon {
                font-size: 32px;
            }
            .gate-btn .gate-label {
                font-size: 20px;
            }
            .gate-count-display .count-number {
                font-size: 40px;
            }
            .gate-view-title {
                font-size: 18px;
            }
            .scanner-wrapper {
                min-height: 140px;
            }
        }

        @media (max-height: 680px) {
            .gate-btn {
                min-height: 80px;
                gap: 2px;
            }
            .gate-btn .gate-icon {
                font-size: 24px;
            }
            .gate-btn .gate-label {
                font-size: 16px;
            }
            .gate-count-display .count-number {
                font-size: 32px;
            }
            .scanner-wrapper {
                min-height: 100px;
            }
        }

        /* count bounce */
        @keyframes countBounce {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }
        .bounce {
            animation: countBounce 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body>

    <!-- ─── FLASH / TOAST ─── -->
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="toast" id="toast"></div>

    <!-- ─── APP ─── -->
    <div id="app">

        <!-- ============================================ -->
        <!-- DASHBOARD VIEW -->
        <!-- ============================================ -->
        <div id="dashboard-view" class="view active">
            <header class="app-header">
                <div class="logo-wrapper">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100" height="100" rx="24" fill="url(#logoGrad)" />
                        <path d="M30 70 L30 40 L50 25 L70 40 L70 70 L50 85 L30 70Z" stroke="white" stroke-width="4.5" fill="none" stroke-linejoin="round" />
                        <path d="M42 55 L50 63 L62 50" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="100" y2="100">
                                <stop offset="0%" stop-color="#2DD4BF" />
                                <stop offset="100%" stop-color="#0EA5E9" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>Event Scanner</h1>
                    <div class="sub">Dual Gate · People Counter</div>
                </div>
            </header>

            <div class="dashboard-grid">
                <button class="gate-btn gate-1" onclick="showGate(1)">
                    <span class="gate-icon">🚪</span>
                    <span class="gate-label">Gate 1</span>
                    <span class="gate-sub" id="dash-count-1">0 entries</span>
                </button>
                <button class="gate-btn gate-2" onclick="showGate(2)">
                    <span class="gate-icon">🚪</span>
                    <span class="gate-label">Gate 2</span>
                    <span class="gate-sub" id="dash-count-2">0 entries</span>
                </button>
            </div>

            <div class="dashboard-footer">
                <button class="reset-all-btn" onclick="resetAll()">⟳ Reset All Counts</button>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- GATE VIEW (shared template) -->
        <!-- ============================================ -->
        <div id="gate-view" class="view">
            <!-- Header -->
            <div class="gate-view-header">
                <button class="back-btn" onclick="showDashboard()">←</button>
                <div class="gate-view-title" id="gateViewTitle">
                    Gate <span id="gateTitleNum" class="highlight-g1">1</span>
                </div>
                <button class="gate-reset-btn" onclick="resetCurrentGate()">↺ Reset</button>
            </div>

            <!-- Count Display -->
            <div class="gate-count-display">
                <div class="count-number" id="gateCountDisplay">0</div>
                <div class="count-label">People Counted</div>
            </div>

            <!-- Scanner & Controls -->
            <div class="gate-view-body">
                <div class="scanner-wrapper" id="scannerWrapper">
                    <div id="scanner-container"></div>
                    <div class="scanner-overlay">
                        <div class="corner tl"></div>
                        <div class="corner tr"></div>
                        <div class="corner bl"></div>
                        <div class="corner br"></div>
                    </div>
                    <div class="scanner-placeholder" id="scannerPlaceholder">
                        <span class="big-icon">📷</span>
                        <span>Camera is off</span>
                        <span style="font-size:12px; opacity:0.6;">Tap "Open Camera" below</span>
                    </div>
                </div>

                <button class="scan-toggle-btn" id="scanToggleBtn" onclick="toggleScanner()">
                    <span>📷</span> Open Camera
                </button>
            </div>
        </div>

    </div>

    <script>
        /* ───────────────────────────────────────────────────────
           STATE
           ─────────────────────────────────────────────────────── */
        let gate1Count = parseInt(localStorage.getItem('event_gate1') || '0');
        let gate2Count = parseInt(localStorage.getItem('event_gate2') || '0');
        let currentGate = 1; // 1 or 2
        let isScanning = false;
        let html5QrCode = null;
        let scanCooldown = false;

        /* ───────────────────────────────────────────────────────
           DOM REFS
           ─────────────────────────────────────────────────────── */
        const $ = id => document.getElementById(id);
        const dashView = $('dashboard-view');
        const gateView = $('gate-view');
        const dashCount1 = $('dash-count-1');
        const dashCount2 = $('dash-count-2');
        const gateTitleNum = $('gateTitleNum');
        const gateCountDisplay = $('gateCountDisplay');
        const scannerPlaceholder = $('scannerPlaceholder');
        const scanToggleBtn = $('scanToggleBtn');
        const flashOverlay = $('flashOverlay');
        const toast = $('toast');

        /* ───────────────────────────────────────────────────────
           UI UPDATE
           ─────────────────────────────────────────────────────── */
        function updateAllUI() {
            dashCount1.textContent = `${gate1Count} entries`;
            dashCount2.textContent = `${gate2Count} entries`;
            if (currentGate === 1) {
                gateCountDisplay.textContent = gate1Count;
                gateTitleNum.textContent = '1';
                gateTitleNum.className = 'highlight-g1';
                scanToggleBtn.className = 'scan-toggle-btn';
            } else {
                gateCountDisplay.textContent = gate2Count;
                gateTitleNum.textContent = '2';
                gateTitleNum.className = 'highlight-g2';
                scanToggleBtn.className = 'scan-toggle-btn';
            }
            localStorage.setItem('event_gate1', String(gate1Count));
            localStorage.setItem('event_gate2', String(gate2Count));
        }

        function bounceCount() {
            gateCountDisplay.classList.remove('bounce');
            void gateCountDisplay.offsetWidth;
            gateCountDisplay.classList.add('bounce');
        }

        /* ───────────────────────────────────────────────────────
           VIEWS / NAVIGATION
           ─────────────────────────────────────────────────────── */
        function showDashboard() {
            // Stop scanner if running
            if (isScanning) stopScannerSync();
            dashView.classList.add('active');
            gateView.classList.remove('active');
            updateAllUI();
        }

        function showGate(gate) {
            currentGate = gate;
            dashView.classList.remove('active');
            gateView.classList.add('active');
            // Reset scanner UI
            if (isScanning) stopScannerSync();
            scannerPlaceholder.classList.remove('hidden');
            scanToggleBtn.innerHTML = '<span>📷</span> Open Camera';
            scanToggleBtn.className = 'scan-toggle-btn';
            updateAllUI();
        }

        /* ───────────────────────────────────────────────────────
           SCANNER ENGINE
           ─────────────────────────────────────────────────────── */
        async function toggleScanner() {
            if (isScanning) {
                stopScannerSync();
                return;
            }
            await startScanner();
        }

        async function startScanner() {
            if (isScanning) return;
            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode('scanner-container');
                }
                const config = {
                    fps: 15,
                    qrbox: { width: 220, height: 220 },
                    aspectRatio: 1.0
                };
                await html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess, onScanError);
                isScanning = true;
                scannerPlaceholder.classList.add('hidden');
                scanToggleBtn.innerHTML = '<span>⏹</span> Close Camera';
                // Style based on gate
                if (currentGate === 1) {
                    scanToggleBtn.className = 'scan-toggle-btn active active-g1';
                } else {
                    scanToggleBtn.className = 'scan-toggle-btn active active-g2';
                }
                showToast('Camera ready', null, 600);
            } catch (err) {
                console.warn('Camera start error:', err);
                alert('Unable to access camera. Please check permissions.');
            }
        }

        function stopScannerSync() {
            if (html5QrCode && isScanning) {
                try {
                    html5QrCode.stop();
                    html5QrCode.clear();
                } catch (_) {}
                isScanning = false;
                scannerPlaceholder.classList.remove('hidden');
                scanToggleBtn.innerHTML = '<span>📷</span> Open Camera';
                scanToggleBtn.className = 'scan-toggle-btn';
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (scanCooldown) return;
            scanCooldown = true;

            // Increment count for current gate
            if (currentGate === 1) gate1Count++;
            else gate2Count++;

            updateAllUI();
            bounceCount();

            // Feedback
            flashScreen(currentGate);
            if (navigator.vibrate) navigator.vibrate(30);
            showToast('+1 entry', currentGate, 800);

            setTimeout(() => {
                scanCooldown = false;
            }, 400);
        }

        function onScanError(err) {
            // ignore
        }

        /* ───────────────────────────────────────────────────────
           RESET FUNCTIONS
           ─────────────────────────────────────────────────────── */
        function resetCurrentGate() {
            if (currentGate === 1) {
                if (gate1Count === 0) return;
                if (!confirm('Reset Gate 1 counter?')) return;
                gate1Count = 0;
            } else {
                if (gate2Count === 0) return;
                if (!confirm('Reset Gate 2 counter?')) return;
                gate2Count = 0;
            }
            updateAllUI();
            showToast(`Gate ${currentGate} reset`, currentGate, 1000);
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function resetAll() {
            if (gate1Count === 0 && gate2Count === 0) return;
            if (!confirm('Reset ALL counters?')) return;
            gate1Count = 0;
            gate2Count = 0;
            updateAllUI();
            showToast('All counters reset', null, 1200);
            if (navigator.vibrate) navigator.vibrate(30);
        }

        /* ───────────────────────────────────────────────────────
           FEEDBACK HELPERS
           ─────────────────────────────────────────────────────── */
        function flashScreen(gate) {
            const el = flashOverlay;
            el.className = 'flash-overlay';
            void el.offsetWidth;
            if (gate === 1) el.classList.add('green');
            else if (gate === 2) el.classList.add('gold');
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 150);
        }

        function showToast(message, gate, duration = 1200) {
            toast.innerHTML = '';
            if (gate) {
                const badge = document.createElement('span');
                badge.className = `gate-badge g${gate}`;
                badge.textContent = `Gate ${gate}`;
                toast.appendChild(badge);
            }
            const text = document.createTextNode(message);
            toast.appendChild(text);
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        /* ───────────────────────────────────────────────────────
           KEYBOARD SHORTCUTS
           ─────────────────────────────────────────────────────── */
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') showGate(1);
            else if (e.key === '2') showGate(2);
            else if (e.key === 'Escape') showDashboard();
            else if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (gateView.classList.contains('active')) toggleScanner();
            }
        });

        /* ───────────────────────────────────────────────────────
           INIT
           ─────────────────────────────────────────────────────── */
        updateAllUI();
        console.log(`🚀 Event Scanner ready. Gate 1: ${gate1Count}, Gate 2: ${gate2Count}`);

        // Clean up scanner on page unload
        window.addEventListener('beforeunload', () => {
            if (html5QrCode && isScanning) {
                try { html5QrCode.stop(); } catch (_) {}
            }
        });
    </script>

</body>
</html>
