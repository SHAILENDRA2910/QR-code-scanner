<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Event Scanner · Dual Gate</title>

    <!-- PWA Meta -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>

    <style>
        /* ───────────────────────────────────────────────
                   RESET & BASE 
                   ─────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #070C1A;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.06);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --shadow-glow: 0 8px 40px rgba(0, 0, 0, 0.8);

            /* Gate 1 (Cyan/Teal) */
            --gate1-primary: #2DD4BF;
            --gate1-glow: rgba(45, 212, 191, 0.3);
            --gate1-bg: rgba(45, 212, 191, 0.06);

            /* Gate 2 (Amber/Yellow) */
            --gate2-primary: #FBBF24;
            --gate2-glow: rgba(251, 191, 36, 0.3);
            --gate2-bg: rgba(251, 191, 36, 0.06);

            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font);
            background: var(--bg-deep);
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ───────────────────────────────────────────────
                   APP SHELL 
                   ─────────────────────────────────────────────── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 24px;
            background: radial-gradient(ellipse at 50% 0%, #111D33 0%, #070C1A 80%);
            position: relative;
            overflow: hidden;
        }

        /* Ambient glow orbs */
        #app::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -25%;
            width: 70%;
            height: 40%;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        #app::after {
            content: '';
            position: absolute;
            bottom: 0%;
            left: -25%;
            width: 70%;
            height: 40%;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ───────────────────────────────────────────────
                   HEADER 
                   ─────────────────────────────────────────────── */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 4px 0 16px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        .logo-wrapper {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2DD4BF, #0EA5E9);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(45, 212, 191, 0.3);
            overflow: hidden;
        }

        .logo-wrapper svg {
            width: 65%;
            height: 65%;
            fill: none;
        }

        .header-text {
            flex: 1;
            min-width: 0;
        }

        .header-text h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
            line-height: 1.2;
            color: #fff;
        }

        .header-text .sub {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-text .sub .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22C55E;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .header-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(8px);
        }

        .header-btn:active {
            transform: scale(0.92);
            background: var(--bg-card-hover);
        }

        /* ───────────────────────────────────────────────
                   SCANNER 
                   ─────────────────────────────────────────────── */
        .scanner-container {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            border-radius: var(--radius-md);
            overflow: hidden;
            aspect-ratio: 4 / 3;
            min-height: 180px;
            background: #000;
            border: 1px solid var(--border-glass);
            box-shadow: 0 0 0 1px rgba(45, 212, 191, 0.1), 0 8px 48px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
        }

        .scanner-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-md);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            z-index: 3;
        }

        #scanner {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #scanner video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }

        /* Scanner Overlay */
        .scanner-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
        }

        .scanner-overlay .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: rgba(255, 255, 255, 0.6);
            border-style: solid;
            border-width: 0;
            filter: drop-shadow(0 0 8px rgba(45, 212, 191, 0.5));
        }

        .scanner-overlay .corner.tl {
            top: 24px;
            left: 24px;
            border-top-width: 3px;
            border-left-width: 3px;
        }

        .scanner-overlay .corner.tr {
            top: 24px;
            right: 24px;
            border-top-width: 3px;
            border-right-width: 3px;
        }

        .scanner-overlay .corner.bl {
            bottom: 24px;
            left: 24px;
            border-bottom-width: 3px;
            border-left-width: 3px;
        }

        .scanner-overlay .corner.br {
            bottom: 24px;
            right: 24px;
            border-bottom-width: 3px;
            border-right-width: 3px;
        }

        /* Scanning Line Animation */
        .scan-line {
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #2DD4BF, transparent);
            box-shadow: 0 0 20px #2DD4BF, 0 0 60px rgba(45, 212, 191, 0.4);
            z-index: 5;
            animation: scanMove 2.8s ease-in-out infinite;
            opacity: 0.6;
            border-radius: 100%;
        }

        @keyframes scanMove {
            0% {
                top: 10%;
                opacity: 0.2;
            }

            50% {
                opacity: 0.9;
            }

            100% {
                top: 90%;
                opacity: 0.2;
            }
        }

        .scanner-status {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.4px;
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
            white-space: nowrap;
            transition: var(--transition);
        }

        .scanner-status.active {
            color: #2DD4BF;
            border-color: rgba(45, 212, 191, 0.2);
            box-shadow: 0 0 30px rgba(45, 212, 191, 0.05);
        }

        .scanner-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #070C1A;
            z-index: 2;
            color: var(--text-muted);
            font-size: 13px;
            gap: 14px;
            transition: opacity 0.4s ease;
        }

        .scanner-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .scanner-loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top-color: #2DD4BF;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ───────────────────────────────────────────────
                   GATES ROW 
                   ─────────────────────────────────────────────── */
        .gates-row {
            display: flex;
            gap: 14px;
            z-index: 1;
            flex-shrink: 0;
            margin-bottom: 16px;
        }

        .gate-card {
            flex: 1;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 18px 12px 16px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-height: 96px;
        }

        .gate-card:active {
            transform: scale(0.96);
        }

        .gate-card .gate-icon {
            font-size: 22px;
            line-height: 1;
            margin-bottom: 2px;
        }

        .gate-card .gate-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .gate-card .gate-count {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            transition: var(--transition);
            letter-spacing: -1px;
        }

        .gate-card .gate-sub {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-top: -2px;
        }

        /* Gate 1 Specific */
        .gate-card.gate-1 .gate-count {
            color: var(--gate1-primary);
        }

        .gate-card.gate-1.active {
            background: var(--gate1-bg);
            border-color: var(--gate1-primary);
            box-shadow: 0 0 40px rgba(45, 212, 191, 0.05), inset 0 0 40px rgba(45, 212, 191, 0.02);
            transform: translateY(-2px);
        }

        .gate-card.gate-1.active .gate-label {
            color: var(--gate1-primary);
        }

        /* Gate 2 Specific */
        .gate-card.gate-2 .gate-count {
            color: var(--gate2-primary);
        }

        .gate-card.gate-2.active {
            background: var(--gate2-bg);
            border-color: var(--gate2-primary);
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.05), inset 0 0 40px rgba(251, 191, 36, 0.02);
            transform: translateY(-2px);
        }

        .gate-card.gate-2.active .gate-label {
            color: var(--gate2-primary);
        }

        /* Reset button inside gate */
        .gate-reset {
            position: absolute;
            top: 8px;
            right: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
        }

        .gate-card:hover .gate-reset,
        .gate-card .gate-reset:focus {
            opacity: 0.6;
            pointer-events: auto;
        }

        .gate-reset:active {
            transform: scale(0.85);
            background: rgba(239, 68, 68, 0.2);
            color: #EF4444;
            opacity: 1;
        }

        /* ───────────────────────────────────────────────
                   STATS BAR (Glassmorphism)
                   ─────────────────────────────────────────────── */
        .stats-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
            flex-shrink: 0;
            padding: 12px 18px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            margin-top: auto;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .stats-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .stats-item .num {
            font-weight: 700;
            font-size: 20px;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .stats-item .num.total {
            color: #60A5FA;
        }

        .stats-divider {
            width: 1px;
            height: 30px;
            background: var(--border-glass);
        }

        .last-scan {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            line-height: 1.4;
        }

        .last-scan .time {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
        }

        .last-scan .gate-label {
            font-size: 9px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .reset-all-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
            height: 32px;
        }

        .reset-all-btn:active {
            transform: scale(0.92);
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.2);
            color: #EF4444;
        }

        /* ───────────────────────────────────────────────
                   FLASH & TOAST 
                   ─────────────────────────────────────────────── */
        .flash-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: rgba(255, 255, 255, 0.2);
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .flash-overlay.show {
            opacity: 1;
        }

        .flash-overlay.green {
            background: rgba(45, 212, 191, 0.25);
        }

        .flash-overlay.gold {
            background: rgba(251, 191, 36, 0.25);
        }

        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(24px);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            padding: 14px 28px;
            border-radius: 40px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--border-glass);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .gate-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toast .gate-badge.g1 {
            background: var(--gate1-bg);
            color: var(--gate1-primary);
            border: 1px solid rgba(45, 212, 191, 0.2);
        }

        .toast .gate-badge.g2 {
            background: var(--gate2-bg);
            color: var(--gate2-primary);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        /* Count Bounce Animation */
        @keyframes countBounce {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }

            100% {
                transform: scale(1);
            }
        }

        .bounce {
            animation: countBounce 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ───────────────────────────────────────────────
                   RESPONSIVE 
                   ─────────────────────────────────────────────── */
        @media (max-width: 420px) {
            #app {
                padding: 14px 12px 18px;
            }

            .header-text h1 {
                font-size: 17px;
            }

            .logo-wrapper {
                width: 44px;
                height: 44px;
            }

            .gate-card .gate-count {
                font-size: 34px;
            }

            .gate-card {
                min-height: 76px;
                padding: 14px 8px 12px;
            }

            .scanner-container {
                aspect-ratio: 4 / 3.2;
                min-height: 140px;
            }

            .stats-item .num {
                font-size: 17px;
            }

            .toast {
                font-size: 13px;
                padding: 10px 20px;
                bottom: 100px;
            }
        }

        @media (max-width: 360px) {
            .gates-row {
                gap: 8px;
            }

            .gate-card .gate-count {
                font-size: 28px;
            }

            .gate-card .gate-label {
                font-size: 10px;
            }

            .stats-bar {
                gap: 6px;
                padding: 10px 12px;
            }

            .stats-divider {
                display: none;
            }

            .reset-all-btn {
                font-size: 10px;
                padding: 4px 10px;
                height: 28px;
            }
        }

        @media (min-height: 780px) {
            .scanner-container {
                aspect-ratio: 4 / 2.8;
                min-height: 240px;
            }
        }

        /* scrollbar hidden */
        ::-webkit-scrollbar {
            width: 0;
        }
    </style>
</head>

<body>

    <!-- ─── FLASH ─── -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- ─── TOAST ─── -->
    <div class="toast" id="toast"></div>

    <!-- ─── APP ─── -->
    <div id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="logo-wrapper" id="logoContainer">
                <!-- Premium Event Logo -->
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" rx="24" fill="url(#logoGrad)" />
                    <path d="M30 70 L30 40 L50 25 L70 40 L70 70 L50 85 L30 70Z" stroke="white" stroke-width="4.5"
                        fill="none" stroke-linejoin="round" />
                    <path d="M42 55 L50 63 L62 50" stroke="white" stroke-width="5.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="100" y2="100">
                            <stop offset="0%" stop-color="#2DD4BF" />
                            <stop offset="100%" stop-color="#0EA5E9" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="header-text">
                <h1>Event Scanner</h1>
                <div class="sub"><span class="dot"></span> Dual Gate · People Counter</div>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="toggleCameraBtn" title="Toggle Camera">📷</button>
            </div>
        </header>

        <!-- SCANNER -->
        <div class="scanner-container">
            <div id="scanner"></div>
            <div class="scanner-overlay">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <div class="scan-line"></div>
            </div>
            <div class="scanner-status" id="scannerStatus">● Initializing…</div>
            <div class="scanner-loading" id="scannerLoading">
                <div class="spinner"></div>
                <span>Starting camera…</span>
            </div>
        </div>

        <!-- GATES -->
        <div class="gates-row">
            <div class="gate-card gate-1 active" id="gate1Btn" data-gate="1">
                <button class="gate-reset" data-gate="1" title="Reset Gate 1">✕</button>
                <span class="gate-icon">🚪</span>
                <span class="gate-label">Gate 1</span>
                <span class="gate-count" id="count1">0</span>
                <span class="gate-sub">entries</span>
            </div>
            <div class="gate-card gate-2" id="gate2Btn" data-gate="2">
                <button class="gate-reset" data-gate="2" title="Reset Gate 2">✕</button>
                <span class="gate-icon">🚪</span>
                <span class="gate-label">Gate 2</span>
                <span class="gate-count" id="count2">0</span>
                <span class="gate-sub">entries</span>
            </div>
        </div>

        <!-- STATS BAR -->
        <div class="stats-bar">
            <div class="stats-item">
                <span>Total</span>
                <span class="num total" id="totalCount">0</span>
            </div>
            <div class="stats-divider"></div>
            <div class="stats-item">
                <span>Last</span>
                <span class="num" id="lastScanTime"
                    style="font-size:14px; font-weight:600; color:var(--text-secondary);">—</span>
            </div>
            <div class="last-scan">
                <span class="time" id="activeGateDisplay">Gate 1</span>
                <span class="gate-label">active</span>
            </div>
            <button class="reset-all-btn" id="resetAllBtn">⟳ Reset</button>
        </div>

    </div>

    <script>
        /* ───────────────────────────────────────────────────────
               APP STATE
               ─────────────────────────────────────────────────────── */
        const state = {
            gate1: parseInt(localStorage.getItem('scan_count_1') || '0'),
            gate2: parseInt(localStorage.getItem('scan_count_2') || '0'),
            activeGate: 1,
            lastScan: localStorage.getItem('scan_last_time') || null,
            isScanning: false,
            scanner: null,
            cameraStarted: false,
        };

        /* ───────────────────────────────────────────────────────
               DOM REFS
               ─────────────────────────────────────────────────────── */
        const $ = (id) => document.getElementById(id);
        const count1El = $('count1');
        const count2El = $('count2');
        const totalEl = $('totalCount');
        const lastScanEl = $('lastScanTime');
        const activeGateDisplay = $('activeGateDisplay');
        const gate1Btn = $('gate1Btn');
        const gate2Btn = $('gate2Btn');
        const scannerStatus = $('scannerStatus');
        const scannerLoading = $('scannerLoading');
        const flashOverlay = $('flashOverlay');
        const toast = $('toast');
        const toggleCameraBtn = $('toggleCameraBtn');
        const resetAllBtn = $('resetAllBtn');

        /* ───────────────────────────────────────────────────────
               UI HELPERS
               ─────────────────────────────────────────────────────── */
        function updateUI() {
            count1El.textContent = state.gate1;
            count2El.textContent = state.gate2;
            totalEl.textContent = state.gate1 + state.gate2;

            gate1Btn.classList.toggle('active', state.activeGate === 1);
            gate2Btn.classList.toggle('active', state.activeGate === 2);
            activeGateDisplay.textContent = `Gate ${state.activeGate}`;

            if (state.lastScan) {
                const d = new Date(state.lastScan);
                lastScanEl.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            } else {
                lastScanEl.textContent = '—';
            }

            localStorage.setItem('scan_count_1', String(state.gate1));
            localStorage.setItem('scan_count_2', String(state.gate2));
            if (state.lastScan) localStorage.setItem('scan_last_time', state.lastScan);
        }

        function bounceCount(gate) {
            const el = gate === 1 ? count1El : count2El;
            el.classList.remove('bounce');
            void el.offsetWidth;
            el.classList.add('bounce');
        }

        function showToast(message, gate, duration = 1400) {
            toast.innerHTML = '';
            if (gate) {
                const badge = document.createElement('span');
                badge.className = `gate-badge g${gate}`;
                badge.textContent = `Gate ${gate}`;
                toast.appendChild(badge);
            }
            const text = document.createTextNode(message);
            toast.appendChild(text);
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        function flashScreen(gate) {
            const el = flashOverlay;
            el.className = 'flash-overlay';
            void el.offsetWidth;
            if (gate === 1) el.classList.add('green');
            else if (gate === 2) el.classList.add('gold');
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 180);
        }

        function vibrate() { if (navigator.vibrate) navigator.vibrate(25); }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 960;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.10, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.10);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.10);
            } catch (_) { }
        }

        /* ───────────────────────────────────────────────────────
               SCAN HANDLER
               ─────────────────────────────────────────────────────── */
        function handleScan(decodedText, decodedResult) {
            if (state.isScanning) return;
            state.isScanning = true;

            const gate = state.activeGate;
            if (gate === 1) state.gate1 += 1;
            else state.gate2 += 1;

            state.lastScan = new Date().toISOString();
            updateUI();
            bounceCount(gate);
            flashScreen(gate);
            vibrate();
            playBeep();
            showToast(`+1 entry recorded`, gate, 1200);

            setTimeout(() => { state.isScanning = false; }, 380);
        }

        /* ───────────────────────────────────────────────────────
               SCANNER ENGINE
               ─────────────────────────────────────────────────────── */
        let scannerInstance = null;
        let isScannerRunning = false;

        async function startScanner() {
            if (scannerInstance && isScannerRunning) return;
            try {
                scannerLoading.classList.remove('hidden');
                scannerStatus.textContent = '● Starting camera…';
                scannerStatus.classList.remove('active');

                if (!scannerInstance) {
                    scannerInstance = new Html5Qrcode('scanner');
                }
                await scannerInstance.start({ facingMode: 'environment' }, {
                    fps: 30,
                    qrbox: { width: 240, height: 240 },
                    aspectRatio: 1.0
                }, handleScan, (err) => { });

                isScannerRunning = true;
                state.cameraStarted = true;
                scannerLoading.classList.add('hidden');
                scannerStatus.textContent = '● Ready — scan QR';
                scannerStatus.classList.add('active');
                showToast('Camera ready', null, 800);
            } catch (err) {
                console.warn(err);
                scannerLoading.classList.add('hidden');
                scannerStatus.textContent = '⚠️ Camera unavailable';
                scannerStatus.classList.remove('active');
                setTimeout(() => { if (!isScannerRunning) startScanner(); }, 3000);
            }
        }

        async function stopScanner() {
            if (scannerInstance && isScannerRunning) {
                try {
                    await scannerInstance.stop();
                    isScannerRunning = false;
                    state.cameraStarted = false;
                    scannerStatus.textContent = '● Camera paused';
                    scannerStatus.classList.remove('active');
                } catch (_) { }
            }
        }

        async function toggleCamera() {
            if (isScannerRunning) {
                await stopScanner();
                toggleCameraBtn.textContent = '📷';
                showToast('Camera paused', null, 800);
            } else {
                await startScanner();
                toggleCameraBtn.textContent = '⏹';
            }
        }

        /* ───────────────────────────────────────────────────────
               GATE SELECTION
               ─────────────────────────────────────────────────────── */
        function setActiveGate(gate) {
            if (state.activeGate === gate) return;
            state.activeGate = gate;
            updateUI();
            if (navigator.vibrate) navigator.vibrate(6);
        }

        /* ───────────────────────────────────────────────────────
               RESET FUNCTIONS
               ─────────────────────────────────────────────────────── */
        function resetGate(gate) {
            if (gate === 1) {
                if (state.gate1 === 0) return;
                state.gate1 = 0;
            } else {
                if (state.gate2 === 0) return;
                state.gate2 = 0;
            }
            updateUI();
            showToast(`Gate ${gate} reset`, gate, 1000);
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function resetAll() {
            if (state.gate1 === 0 && state.gate2 === 0) return;
            if (confirm('Reset both gate counters?')) {
                state.gate1 = 0;
                state.gate2 = 0;
                state.lastScan = null;
                updateUI();
                showToast('All counters reset', null, 1200);
                if (navigator.vibrate) navigator.vibrate(20);
            }
        }

        /* ───────────────────────────────────────────────────────
               EVENT LISTENERS
               ─────────────────────────────────────────────────────── */
        gate1Btn.addEventListener('click', (e) => {
            if (e.target.closest('.gate-reset')) return;
            setActiveGate(1);
        });
        gate2Btn.addEventListener('click', (e) => {
            if (e.target.closest('.gate-reset')) return;
            setActiveGate(2);
        });

        document.querySelectorAll('.gate-reset').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const gate = parseInt(btn.dataset.gate);
                resetGate(gate);
            });
        });

        resetAllBtn.addEventListener('click', resetAll);
        toggleCameraBtn.addEventListener('click', toggleCamera);

        document.addEventListener('keydown', (e) => {
            if (e.key === '1') setActiveGate(1);
            else if (e.key === '2') setActiveGate(2);
            else if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                toggleCamera();
            } else if (e.key === 'r' || e.key === 'R') {
                if (e.ctrlKey || e.metaKey) return;
                resetAll();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !isScannerRunning && state.cameraStarted) startScanner();
        });

        /* ───────────────────────────────────────────────────────
               INIT
               ─────────────────────────────────────────────────────── */
        updateUI();
        setTimeout(startScanner, 600);
        window.addEventListener('beforeunload', () => { stopScanner(); });

        console.log('✨ Event Scanner PWA · UI Enhanced');
        console.log(`Gate 1: ${state.gate1} | Gate 2: ${state.gate2} | Total: ${state.gate1 + state.gate2}`);
    </script>

</body>

</html>
