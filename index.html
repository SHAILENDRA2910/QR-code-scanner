<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Event Entry · Gold Squirrel</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#F8F3EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- QR Library (ZXing) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>

    <style>
        /* ───────────── RESET & BASE ───────────── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Light, warm, company-friendly palette */
            --bg-primary: #FBF8F4;        /* soft ivory */
            --bg-card: #FFFFFF;
            --bg-card-hover: #F5F0EA;
            --border-light: #E5DDD3;
            --text-primary: #2C241A;      /* warm dark */
            --text-secondary: #6B5F4E;
            --text-muted: #A69682;

            --gate1-primary: #B88A4B;      /* gold / squirrel */
            --gate1-glow: rgba(184, 138, 75, 0.20);
            --gate1-bg: rgba(184, 138, 75, 0.08);

            --gate2-primary: #8F7A5C;      ·-- warm earth
            --gate2-glow: rgba(143, 122, 92, 0.20);
            --gate2-bg: rgba(143, 122, 92, 0.08);

            --accent-gold: #C69C5A;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 14px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ───────────── APP SHELL ───────────── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            padding: 18px 16px 24px;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* subtle warm glow */
        #app::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -20%;
            width: 70%;
            height: 60%;
            background: radial-gradient(circle, rgba(184, 138, 75, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ───────────── VIEWS ───────────── */
        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.25s ease;
        }
        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ───────────── HEADER (brand) ───────────── */
        .app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 14px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 10px;
        }

        .logo-wrapper {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #FDF9F4;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }
        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .header-text h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .header-text .sub {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
        }
        .brand-gold {
            color: var(--accent-gold);
            font-weight: 700;
        }

        /* ───────────── DASHBOARD ───────────── */
        .dashboard-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
            padding: 8px 0;
        }

        .gate-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 20px 22px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
            min-height: 90px;
        }
        .gate-card.gate-1 {
            border-left: 5px solid var(--gate1-primary);
        }
        .gate-card.gate-2 {
            border-left: 5px solid var(--gate2-primary);
        }

        .gate-card .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .gate-card .gate-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-secondary);
        }
        .gate-card .gate-count {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }
        .gate-card.gate-1 .gate-count {
            color: var(--gate1-primary);
        }
        .gate-card.gate-2 .gate-count {
            color: var(--gate2-primary);
        }
        .gate-card .gate-sub {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .gate-card .action-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            min-width: 110px;
            justify-content: center;
        }
        .gate-card .action-btn:active {
            transform: scale(0.94);
            background: var(--bg-card-hover);
        }
        .gate-card.gate-1 .action-btn:active {
            border-color: var(--gate1-primary);
            color: var(--gate1-primary);
            background: var(--gate1-bg);
        }
        .gate-card.gate-2 .action-btn:active {
            border-color: var(--gate2-primary);
            color: var(--gate2-primary);
            background: var(--gate2-bg);
        }

        /* Dashboard footer */
        .dash-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            flex-shrink: 0;
            border-top: 1px solid var(--border-light);
            margin-top: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .total-display {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .total-display .label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .total-display .number {
            font-size: 28px;
            font-weight: 800;
            color: var(--gate1-primary);
            font-variant-numeric: tabular-nums;
        }
        .dash-footer .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 30px;
            background: #E8F0E6;
            color: #2A6B3A;
            border: 1px solid #C6DCC2;
        }
        .dash-footer .status-badge.offline {
            background: #F5E8E6;
            color: #A34A3A;
            border-color: #E5CBC6;
        }
        .reset-all-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }
        .reset-all-btn:active {
            background: rgba(180, 80, 60, 0.06);
            border-color: rgba(180, 80, 60, 0.2);
            color: #B4503C;
        }

        /* ───────────── GATE VIEW ───────────── */
        .gate-view-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 14px;
        }
        .back-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        .back-btn:active {
            transform: scale(0.90);
            background: var(--bg-card-hover);
        }
        .gate-view-title {
            flex: 1;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .gate-view-title .g1 {
            color: var(--gate1-primary);
        }
        .gate-view-title .g2 {
            color: var(--gate2-primary);
        }
        .gate-reset-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 20px;
        }
        .gate-reset-btn:active {
            background: rgba(180, 80, 60, 0.05);
            color: #B4503C;
        }

        /* Count + Last Scan row */
        .count-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            flex-shrink: 0;
            margin-bottom: 14px;
            justify-content: space-between;
            flex-wrap: wrap;
            box-shadow: var(--shadow-sm);
        }
        .count-stats .main-count {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .count-stats .main-count .num {
            font-size: 44px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            transition: var(--transition);
        }
        .count-stats .main-count .num.g1 {
            color: var(--gate1-primary);
        }
        .count-stats .main-count .num.g2 {
            color: var(--gate2-primary);
        }
        .count-stats .main-count .label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .count-stats .last-info {
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .count-stats .last-info .qr-id {
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .count-stats .last-info .time {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Scanner */
        .scanner-wrapper {
            flex: 1;
            min-height: 200px;
            background: #F2EDE6;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-light);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }
        #scanner-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #scanner-container video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }

        .scanner-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            background: #F2EDE6;
            z-index: 2;
            transition: opacity 0.3s ease;
            padding: 20px;
            text-align: center;
        }
        .scanner-placeholder.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .scanner-placeholder .big-icon {
            font-size: 44px;
            opacity: 0.4;
        }
        .scanner-placeholder .sub {
            font-size: 12px;
            opacity: 0.6;
        }

        .scanner-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
        }
        .scanner-overlay .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: rgba(44, 36, 26, 0.3);
            border-style: solid;
            border-width: 0;
        }
        .scanner-overlay .corner.tl { top: 16px; left: 16px; border-top-width: 3px; border-left-width: 3px; }
        .scanner-overlay .corner.tr { top: 16px; right: 16px; border-top-width: 3px; border-right-width: 3px; }
        .scanner-overlay .corner.bl { bottom: 16px; left: 16px; border-bottom-width: 3px; border-left-width: 3px; }
        .scanner-overlay .corner.br { bottom: 16px; right: 16px; border-bottom-width: 3px; border-right-width: 3px; }

        .scan-toggle-btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            flex-shrink: 0;
            margin-top: 12px;
            box-shadow: var(--shadow-sm);
        }
        .scan-toggle-btn:active {
            transform: scale(0.97);
        }
        .scan-toggle-btn.open:active {
            background: var(--bg-card-hover);
        }
        .scan-toggle-btn.active-g1 {
            background: var(--gate1-bg);
            border-color: var(--gate1-primary);
            color: var(--gate1-primary);
        }
        .scan-toggle-btn.active-g2 {
            background: var(--gate2-bg);
            border-color: var(--gate2-primary);
            color: var(--gate2-primary);
        }
        .scan-toggle-btn .icon {
            font-size: 20px;
        }

        /* ───────────── TOAST / FLASH ───────────── */
        .flash-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: rgba(255, 255, 255, 0.12);
            opacity: 0;
            transition: opacity 0.08s ease;
        }
        .flash-overlay.show {
            opacity: 1;
        }
        .flash-overlay.green {
            background: rgba(184, 138, 75, 0.15);
        }
        .flash-overlay.gold {
            background: rgba(143, 122, 92, 0.15);
        }
        .flash-overlay.red {
            background: rgba(190, 70, 50, 0.15);
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(24px);
            z-index: 1000;
            background: rgba(255, 250, 244, 0.94);
            backdrop-filter: blur(12px);
            padding: 14px 28px;
            border-radius: 40px;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--border-light);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .toast .badge.g1 {
            background: var(--gate1-bg);
            color: var(--gate1-primary);
            border: 1px solid rgba(184,138,75,0.2);
        }
        .toast .badge.g2 {
            background: var(--gate2-bg);
            color: var(--gate2-primary);
            border: 1px solid rgba(143,122,92,0.2);
        }
        .toast .badge.err {
            background: rgba(190, 70, 50, 0.08);
            color: #B4503C;
            border: 1px solid rgba(190,70,50,0.15);
        }

        /* ───────────── BOUNCE ───────────── */
        @keyframes countBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .bounce {
            animation: countBounce 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 420px) {
            #app { padding: 12px 10px 16px; }
            .gate-card { padding: 14px 16px; min-height: 72px; }
            .gate-card .gate-count { font-size: 32px; }
            .gate-card .action-btn { font-size: 12px; padding: 8px 12px; min-width: 80px; }
            .count-stats .main-count .num { font-size: 32px; }
            .scan-toggle-btn { font-size: 15px; padding: 14px; }
            .total-display .number { font-size: 22px; }
        }
        @media (max-height: 680px) {
            .gate-card { min-height: 60px; padding: 10px 14px; }
            .gate-card .gate-count { font-size: 26px; }
            .count-stats { padding: 8px 14px; }
            .count-stats .main-count .num { font-size: 26px; }
            .scanner-wrapper { min-height: 120px; }
            .app-header { padding-bottom: 8px; margin-bottom: 6px; }
            .gate-view-header { padding-bottom: 8px; margin-bottom: 8px; }
        }
    </style>
</head>
<body>

    <!-- ─── FLASH / TOAST ─── -->
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="toast" id="toast"></div>

    <!-- ─── APP ─── -->
    <div id="app">

        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="view active">
            <header class="app-header">
                <div class="logo-wrapper">
                    <img src="logo.png" alt="Gold Squirrel Studio" style="width:100%; height:100%; object-fit:contain;" />
                </div>
                <div class="header-text">
                    <h1>Gold Squirrel <span class="brand-gold">Studio</span></h1>
                    <div class="sub">Event Entry · Live Counter</div>
                </div>
            </header>

            <div class="dashboard-grid">
                <!-- Gate 1 Card -->
                <div class="gate-card gate-1">
                    <div class="info">
                        <div class="gate-label">🚪 Gate 1</div>
                        <div class="gate-count" id="dash-count-1">0</div>
                        <div class="gate-sub" id="dash-last-1">Last scan: —</div>
                    </div>
                    <button class="action-btn" onclick="openGateView(1)">
                        <span class="icon">📷</span> Open
                    </button>
                </div>

                <!-- Gate 2 Card -->
                <div class="gate-card gate-2">
                    <div class="info">
                        <div class="gate-label">🚪 Gate 2</div>
                        <div class="gate-count" id="dash-count-2">0</div>
                        <div class="gate-sub" id="dash-last-2">Last scan: —</div>
                    </div>
                    <button class="action-btn" onclick="openGateView(2)">
                        <span class="icon">📷</span> Open
                    </button>
                </div>
            </div>

            <div class="dash-footer">
                <div class="total-display">
                    <span class="label">Total</span>
                    <span class="number" id="dash-total">0</span>
                </div>
                <span class="status-badge" id="onlineBadge">● Online</span>
                <button class="reset-all-btn" onclick="resetAll()">⟳ Reset</button>
            </div>
        </div>

        <!-- GATE VIEW (shared) -->
        <div id="gate-view" class="view">
            <div class="gate-view-header">
                <button class="back-btn" onclick="closeGateView()">←</button>
                <div class="gate-view-title" id="gateViewTitle">Gate <span id="gateTitleNum" class="g1">1</span></div>
                <button class="gate-reset-btn" onclick="resetCurrentGate()">↺ Reset</button>
            </div>

            <div class="count-stats">
                <div class="main-count">
                    <span class="num" id="gateCountNum">0</span>
                    <span class="label">people</span>
                </div>
                <div class="last-info">
                    <div class="qr-id" id="lastQRId">—</div>
                    <div class="time" id="lastQRTime">No scans yet</div>
                </div>
            </div>

            <div class="scanner-wrapper" id="scannerWrapper">
                <div id="scanner-container"></div>
                <div class="scanner-overlay">
                    <div class="corner tl"></div>
                    <div class="corner tr"></div>
                    <div class="corner bl"></div>
                    <div class="corner br"></div>
                </div>
                <div class="scanner-placeholder" id="scannerPlaceholder">
                    <span class="big-icon">📷</span>
                    <span>Camera is off</span>
                    <span class="sub">Tap "Open Camera" below</span>
                </div>
            </div>

            <button class="scan-toggle-btn open" id="scanToggleBtn" onclick="toggleScanner()">
                <span class="icon">📷</span> Open Camera
            </button>
        </div>
    </div>

    <script>
        /* ──────────────────────────────────────────────────────────
           STATE — now with central‑backend ready logic.
           Duplicate prevention: QR‑based, not gate‑based.
           ────────────────────────────────────────────────────────── */
        let gate1Count = parseInt(localStorage.getItem('event_gate1') || '0');
        let gate2Count = parseInt(localStorage.getItem('event_gate2') || '0');

        // Last scan data (per gate for UI)
        let lastScans = {
            1: { qr: localStorage.getItem('event_lastQR_1') || null, time: localStorage.getItem('event_lastTime_1') || null },
            2: { qr: localStorage.getItem('event_lastQR_2') || null, time: localStorage.getItem('event_lastTime_2') || null }
        };

        // Global scanned set (QR‑based, not gate‑based)
        let scannedSet = new Set();

        // Load previously scanned QR codes from localStorage (global)
        function loadGlobalScanned() {
            const stored = localStorage.getItem('global_scanned_qrs');
            if (stored) {
                try {
                    const arr = JSON.parse(stored);
                    arr.forEach(qr => scannedSet.add(qr));
                } catch (_) {}
            }
        }
        loadGlobalScanned();

        function persistGlobalScanned() {
            localStorage.setItem('global_scanned_qrs', JSON.stringify(Array.from(scannedSet)));
        }

        let currentGate = 1;
        let isScannerRunning = false;
        let html5QrCode = null;
        let scanCooldown = false;

        // DOM refs
        const $ = id => document.getElementById(id);
        const dashView = $('dashboard-view');
        const gateView = $('gate-view');
        const dashCount1 = $('dash-count-1');
        const dashCount2 = $('dash-count-2');
        const dashLast1 = $('dash-last-1');
        const dashLast2 = $('dash-last-2');
        const dashTotal = $('dash-total');
        const gateTitleNum = $('gateTitleNum');
        const gateCountNum = $('gateCountNum');
        const lastQRId = $('lastQRId');
        const lastQRTime = $('lastQRTime');
        const scannerPlaceholder = $('scannerPlaceholder');
        const scanToggleBtn = $('scanToggleBtn');
        const flashOverlay = $('flashOverlay');
        const toast = $('toast');
        const onlineBadge = $('onlineBadge');

        // ─── UI UPDATE ───
        function updateAllUI() {
            dashCount1.textContent = gate1Count;
            dashCount2.textContent = gate2Count;
            dashTotal.textContent = gate1Count + gate2Count;

            const fmtTime = (ts) => ts ? new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
            dashLast1.textContent = `Last scan: ${lastScans[1].qr ? fmtTime(lastScans[1].time) : '—'}`;
            dashLast2.textContent = `Last scan: ${lastScans[2].qr ? fmtTime(lastScans[2].time) : '—'}`;

            const count = currentGate === 1 ? gate1Count : gate2Count;
            gateCountNum.textContent = count;
            gateCountNum.className = 'num ' + (currentGate === 1 ? 'g1' : 'g2');

            const last = lastScans[currentGate];
            lastQRId.textContent = last.qr || '—';
            lastQRTime.textContent = last.time ? new Date(last.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'No scans yet';

            gateTitleNum.textContent = currentGate;
            gateTitleNum.className = currentGate === 1 ? 'g1' : 'g2';

            // Persist counters & last scan
            localStorage.setItem('event_gate1', String(gate1Count));
            localStorage.setItem('event_gate2', String(gate2Count));
            localStorage.setItem('event_lastQR_1', lastScans[1].qr || '');
            localStorage.setItem('event_lastTime_1', lastScans[1].time || '');
            localStorage.setItem('event_lastQR_2', lastScans[2].qr || '');
            localStorage.setItem('event_lastTime_2', lastScans[2].time || '');

            // Online badge (simulated, can be toggled manually for demo)
            // we keep it always online for frontend demo
            onlineBadge.textContent = '● Online';
            onlineBadge.className = 'status-badge';
        }

        function bounceCount() {
            gateCountNum.classList.remove('bounce');
            void gateCountNum.offsetWidth;
            gateCountNum.classList.add('bounce');
        }

        // ─── NAVIGATION ───
        function openGateView(gate) {
            if (isScannerRunning) stopScannerSync();
            currentGate = gate;
            scannerPlaceholder.classList.remove('hidden');
            scanToggleBtn.innerHTML = '<span class="icon">📷</span> Open Camera';
            scanToggleBtn.className = 'scan-toggle-btn open';

            dashView.classList.remove('active');
            gateView.classList.add('active');
            updateAllUI();
        }

        function closeGateView() {
            if (isScannerRunning) stopScannerSync();
            gateView.classList.remove('active');
            dashView.classList.add('active');
            updateAllUI();
        }

        // ─── SCANNER ───
        async function toggleScanner() {
            if (isScannerRunning) {
                stopScannerSync();
                return;
            }
            await startScanner();
        }

        async function startScanner() {
            if (isScannerRunning) return;
            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode('scanner-container');
                }
                const config = { fps: 15, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 };
                await html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess, onScanError);
                isScannerRunning = true;
                scannerPlaceholder.classList.add('hidden');

                const gateClass = currentGate === 1 ? 'active-g1' : 'active-g2';
                scanToggleBtn.innerHTML = '<span class="icon">⏹</span> Close Camera';
                scanToggleBtn.className = `scan-toggle-btn ${gateClass}`;

                showToast('Camera ready', null, 600);
            } catch (err) {
                console.warn(err);
                alert('Unable to access camera. Please check permissions.');
            }
        }

        function stopScannerSync() {
            if (html5QrCode && isScannerRunning) {
                try { html5QrCode.stop(); html5QrCode.clear(); } catch (_) {}
                isScannerRunning = false;
                scannerPlaceholder.classList.remove('hidden');
                scanToggleBtn.innerHTML = '<span class="icon">📷</span> Open Camera';
                scanToggleBtn.className = 'scan-toggle-btn open';
            }
        }

        // ─── SCAN HANDLER (backend‑ready) ───
        function onScanSuccess(decodedText, decodedResult) {
            if (scanCooldown) return;
            scanCooldown = true;

            const qr = decodedText.trim();

            // ---- GLOBAL duplicate check (QR‑based, not gate‑based) ----
            if (scannedSet.has(qr)) {
                flashScreen('red');
                // show which gate first scanned? we can show from lastScans but we keep simple
                showToast('Already scanned (global)', 'err', 1200);
                scanCooldown = false;
                setTimeout(() => { scanCooldown = false; }, 300);
                return;
            }

            // ---- Valid scan: increment gate counter ----
            if (currentGate === 1) gate1Count++;
            else gate2Count++;

            // Add to global set & persist
            scannedSet.add(qr);
            persistGlobalScanned();

            // Update last scan
            lastScans[currentGate] = { qr: qr, time: new Date().toISOString() };

            updateAllUI();
            bounceCount();
            flashScreen(currentGate);
            if (navigator.vibrate) navigator.vibrate(30);
            showToast('✓ Entry recorded', currentGate, 900);

            // Auto‑close camera after scan (operator flow)
            setTimeout(() => {
                if (isScannerRunning) {
                    stopScannerSync();
                    showToast('Camera closed — ready for next', null, 600);
                }
            }, 500);

            setTimeout(() => { scanCooldown = false; }, 400);
        }

        function onScanError(err) { /* ignore */ }

        // ─── RESET ───
        function resetCurrentGate() {
            const count = currentGate === 1 ? gate1Count : gate2Count;
            if (count === 0) return;
            if (!confirm(`Reset Gate ${currentGate} counter?`)) return;

            if (currentGate === 1) gate1Count = 0;
            else gate2Count = 0;

            // For gate reset we keep global scanned set, but we could also clear?
            // We keep global set untouched to preserve duplicate prevention.
            lastScans[currentGate] = { qr: null, time: null };
            updateAllUI();
            showToast(`Gate ${currentGate} reset`, currentGate, 1000);
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function resetAll() {
            if (gate1Count === 0 && gate2Count === 0 && scannedSet.size === 0) return;
            if (!confirm('Reset ALL counters AND clear global scan history?')) return;

            gate1Count = 0;
            gate2Count = 0;
            lastScans = { 1: { qr: null, time: null }, 2: { qr: null, time: null } };
            scannedSet.clear();
            persistGlobalScanned();
            updateAllUI();
            showToast('All counters & history reset', null, 1200);
            if (navigator.vibrate) navigator.vibrate(30);
        }

        // ─── FEEDBACK ───
        function flashScreen(type) {
            const el = flashOverlay;
            el.className = 'flash-overlay';
            void el.offsetWidth;
            if (type === 1) el.classList.add('green');
            else if (type === 2) el.classList.add('gold');
            else if (type === 'red') el.classList.add('red');
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 180);
        }

        function showToast(message, badgeType, duration = 1200) {
            toast.innerHTML = '';
            if (badgeType) {
                const b = document.createElement('span');
                b.className = 'badge ' + (badgeType === 'err' ? 'err' : `g${badgeType}`);
                b.textContent = badgeType === 'err' ? '⛔ Duplicate' : `Gate ${badgeType}`;
                toast.appendChild(b);
            }
            const text = document.createTextNode(message);
            toast.appendChild(text);
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ─── KEYBOARD ───
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') { if (dashView.classList.contains('active')) openGateView(1); }
            else if (e.key === '2') { if (dashView.classList.contains('active')) openGateView(2); }
            else if (e.key === 'Escape') { if (gateView.classList.contains('active')) closeGateView(); }
            else if (e.key === ' ' || e.key === 'Space') { if (gateView.classList.contains('active')) { e.preventDefault(); toggleScanner(); } }
        });

        // ─── INIT ───
        updateAllUI();
        console.log(`🐿️ Gold Squirrel Event Scanner ready. Gate1: ${gate1Count}, Gate2: ${gate2Count}, global unique: ${scannedSet.size}`);

        window.addEventListener('beforeunload', () => {
            if (html5QrCode && isScannerRunning) {
                try { html5QrCode.stop(); } catch (_) {}
            }
        });
    </script>
</body>
</html>
